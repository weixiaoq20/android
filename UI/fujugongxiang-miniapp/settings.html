<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>福聚贡翔 · 设置</title>
<style>
:root{--brand:#E23A2E;--brand2:#EE4A2F;--ink:#2A2420;--soft:#FFF6F3;--shadow:0 6px 18px rgba(120,60,50,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:#EBE4DE;display:flex;align-items:center;justify-content:center}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{width:100%;height:100%;max-width:393px;max-height:852px;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#FCE4E1 0%,#FBE9E4 16%,#FDF7F4 34%,#FFFDFC 48%,#FFFDFC 100%);position:relative}
.status{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:16px;font-weight:700;color:#1B1B1D}
.si{display:flex;align-items:center;gap:5px}
.navbar{flex:0 0 46px;display:flex;align-items:center;justify-content:center;position:relative;padding:0 13px}
.navbar h1{margin:0;font-size:16px;font-weight:800}
.navbar .back{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 3px 9px rgba(160,110,80,.08)}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;padding:6px 14px 20px}
.scroll::-webkit-scrollbar{display:none}
.group{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:10px}
.row{display:flex;align-items:center;gap:10px;padding:14px 14px;border-bottom:1px solid #F6EFE9;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .lab{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.row .val{flex:0 0 auto;font-size:11.5px;color:#A79A91;margin-right:2px}
.row .arr{flex:0 0 12px;color:#C9BDB5}
.sw{width:40px;height:22px;border-radius:999px;background:#E9DFD8;position:relative;transition:background .18s;flex:0 0 40px}
.sw:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:left .18s}
.sw.on{background:linear-gradient(135deg,#FB6E4E,#F03A2C)}
.sw.on:after{left:20px}
.logout{margin-top:16px;height:44px;width:100%;border-radius:999px;background:#fff;border:1px solid #F2C3AE;color:var(--brand2);font-size:14px;font-weight:700;box-shadow:var(--shadow)}
.ver{text-align:center;margin-top:16px;font-size:10.5px;color:#B3A69C;line-height:1.6}
.homebar{height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center}
.homebar i{width:134px;height:5px;border-radius:3px;background:#1D1D1F;display:block}
.toast{position:absolute;left:50%;bottom:52px;transform:translate(-50%,10px);background:rgba(38,28,22,.88);color:#fff;font-size:11px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:all .22s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
<div class="status"><span>9:41</span>
<div class="si">
<svg fill="#2A211B" height="11" viewBox="0 0 17 11" width="17"><rect height="4" rx="1" width="3" x="0" y="7"></rect><rect height="6" rx="1" width="3" x="4.5" y="5"></rect><rect height="8.5" rx="1" width="3" x="9" y="2.5"></rect><rect height="11" rx="1" width="3" x="13.5" y="0"></rect></svg>
<svg fill="#2A211B" height="11" viewBox="0 0 15 11" width="15"><path d="M7.5 10.2 5.4 7.9a3.1 3.1 0 0 1 4.2 0zM2.6 5.1 1 3.4a9.4 9.4 0 0 1 13 0l-1.6 1.7a7 7 0 0 0-9.8 0z"></path></svg>
<svg height="11" viewBox="0 0 24 11" width="24"><rect fill="none" height="10" rx="3" stroke="#2A211B" stroke-opacity=".5" width="20" x=".5" y=".5"></rect><rect fill="#2A211B" height="7" rx="1.6" width="16" x="2" y="2"></rect><rect fill="#2A211B" height="4" opacity=".6" rx=".7" width="1.5" x="22" y="3.5"></rect></svg>
</div>
</div>
<div class="navbar">
<a aria-label="返回" class="back" href="profile.html"><svg fill="none" height="21" viewBox="0 0 24 24" width="21"><path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1"></path></svg></a>
<h1>设置</h1>
</div>
<div class="scroll">
<div class="group">
<button class="row" type="button" onclick="toast('账号与安全（演示）')">
<span class="lab">账号与安全</span><span class="val">已绑定微信</span>
<svg class="arr" fill="none" height="12" viewBox="0 0 24 24" width="12"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</button>
<button class="row" type="button" onclick="toast('手机号设置（演示）')">
<span class="lab">手机号</span><span class="val">138****6688</span>
<svg class="arr" fill="none" height="12" viewBox="0 0 24 24" width="12"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</button>
<a class="row" href="address.html">
<span class="lab">收货地址</span><span class="val">3 个</span>
<svg class="arr" fill="none" height="12" viewBox="0 0 24 24" width="12"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</a>
</div>
<div class="group">
<div class="row">
<span class="lab">订单消息通知</span>
<button aria-label="开关" class="sw on" type="button" onclick="this.classList.toggle('on')"></button>
</div>
<div class="row">
<span class="lab">活动与优惠推送</span>
<button aria-label="开关" class="sw" type="button" onclick="this.classList.toggle('on')"></button>
</div>
<button class="row" type="button" onclick="toast('隐私设置（演示）')">
<span class="lab">隐私设置</span><span class="val"></span>
<svg class="arr" fill="none" height="12" viewBox="0 0 24 24" width="12"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</button>
</div>
<div class="group">
<button class="row" type="button" onclick="toast('清除缓存成功')">
<span class="lab">清除缓存</span><span class="val">12.6 MB</span>
<svg class="arr" fill="none" height="12" viewBox="0 0 24 24" width="12"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</button>
<button class="row" type="button" onclick="toast('当前已是最新版本')">
<span class="lab">检查更新</span><span class="val">v1.0.0</span>
<svg class="arr" fill="none" height="12" viewBox="0 0 24 24" width="12"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</button>
<button class="row" type="button" onclick="toast('关于福聚贡翔（演示）')">
<span class="lab">关于福聚贡翔</span><span class="val"></span>
<svg class="arr" fill="none" height="12" viewBox="0 0 24 24" width="12"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</button>
</div>
<button class="logout" type="button" onclick="toast('已退出登录（演示）')">退出登录</button>
<div class="ver">福聚贡翔 · 让同城好物离你更近<br/>当前版本 v1.0.0 · 成都站</div>
</div>
<div class="homebar"><i></i></div>
<div class="toast" id="toast"></div>
</div>
<script>
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__t);
  window.__t = setTimeout(function () { el.classList.remove('show'); }, 1600);
}
</script>
</body>
</html>
