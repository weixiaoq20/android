<!DOCTYPE html>

<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>福聚贡翔 · 当前订单</title>
<style>
:root{--brand:#E23A2E;--brand2:#EE4A2F;--ink:#2A2420;--muted:#8C8C90;--soft:#FFF6F3;--shadow:0 6px 18px rgba(120,60,50,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:#EBE4DE;display:flex;align-items:center;justify-content:center}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
.app{width:100%;height:100%;max-width:393px;max-height:852px;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#FCE4E1 0%,#FBE9E4 16%,#FDF7F4 34%,#FFFDFC 48%,#FFFDFC 100%);position:relative}
.status{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:16px;font-weight:700;color:#1B1B1D}
.si{display:flex;align-items:center;gap:5px}
.navbar{flex:0 0 46px;display:flex;align-items:center;justify-content:center;position:relative;padding:0 13px}
.navbar h1{margin:0;font-size:16px;font-weight:800}
.navbar .back{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 3px 9px rgba(160,110,80,.08)}
.navbar .tip{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:600;color:var(--brand2)}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;padding:2px 12px 18px}
.scroll::-webkit-scrollbar{display:none}
.notice{display:flex;align-items:center;gap:7px;margin-top:4px;background:#FFF6F3;border:1px solid #FAD3C6;border-radius:12px;padding:9px 11px;font-size:11px;color:#B3411F;line-height:1.45}
.notice .ic{width:18px;height:18px;border-radius:50%;background:#FFE8DF;color:var(--brand2);display:grid;place-items:center;flex:0 0 18px;font-size:11px;font-weight:800}
.card{background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.shop{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid #F6EFE9}
.shop .slogo{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,#FE9E7E,#F2452E);display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800;flex:0 0 42px;box-shadow:0 4px 10px rgba(232,70,45,.2)}
.shop .sinfo{flex:1;min-width:0}
.shop .sname{font-size:14px;font-weight:800;line-height:1.3}
.shop .sdesc{margin:4px 0 0;font-size:10.5px;color:#A79A91;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop .badge{flex:0 0 auto;font-size:10px;font-weight:700;color:var(--brand2);background:var(--soft);border:1px solid #F7A392;border-radius:999px;padding:4px 9px;line-height:1}
.item{display:flex;gap:10px;padding:12px 13px;border-bottom:1px solid #F6EFE9;min-width:0}
.item:last-of-type{border-bottom:0}
.item.picked{background:#FFFCFA;box-shadow:inset 2.5px 0 0 var(--brand2)}
.item .thumb{width:56px;height:56px;border-radius:12px;flex:0 0 56px;display:grid;place-items:center;overflow:hidden}
.item .thumb svg{width:44px;height:44px;display:block}
.thumb.t1{background:linear-gradient(150deg,#FFE7D6,#F9BF9B)}
.thumb.t2{background:linear-gradient(150deg,#EAF4FF,#B9D8F5)}
.thumb.t3{background:linear-gradient(150deg,#F3FFE4,#CBE8A4)}
.ii{flex:1;min-width:0;display:flex;flex-direction:column}
.ii .top{display:flex;align-items:flex-start;gap:6px;min-width:0}
.ii h3{margin:0;flex:1;min-width:0;font-size:12px;line-height:1.4;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.del{flex:0 0 24px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#B3A69C;background:#FAF5F1;margin-top:-2px}
.del:active{background:#FBDCCF;color:var(--brand2)}
.ii .mdl{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:9.5px;color:#8C8C90;white-space:nowrap;overflow:hidden}
.ii .mdl .tag{color:#8A7C72;background:#FBF7F3;border:1px solid #F1E7DF;border-radius:5px;padding:0 5px;line-height:1.6}
.ii .btm{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.sub{font-size:15px;font-weight:800;color:var(--brand);letter-spacing:-.4px;line-height:1;white-space:nowrap}
.sub small{font-size:10px;margin-right:1px}
.sub em{font-style:normal;font-size:9px;font-weight:600;color:#C48A78;margin-left:3px}
.stepper{display:inline-flex;align-items:center;justify-content:space-between;gap:2px;padding:0 3px;background:#fff;border:1px solid #F0E3DA;border-radius:999px;height:28px;width:102px}
.stepper button{width:26px;height:28px;flex:0 0 26px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:999px;line-height:0}
.stepper button svg{display:block;width:12px;height:12px;pointer-events:none}
.stepper button svg path{stroke-width:2.4;stroke-linecap:round}
.stepper .plus{background:linear-gradient(140deg,#FB6E4E,#F03A2C);box-shadow:0 2px 6px rgba(226,58,46,.28)}
.stepper .plus svg path{stroke:#fff}
.stepper .minus{background:#FDEDE6}
.stepper .minus svg path{stroke:var(--brand)}
.stepper .minus:disabled{background:#F4EFEA}
.stepper .minus:disabled svg path{stroke:#A79C93}
.stepper .plus:disabled{background:linear-gradient(140deg,#FB9A85,#F47869);box-shadow:none}
.stepper .qv{flex:0 0 36px;width:36px;height:28px;border:0;outline:none;background:transparent;padding:0;margin:0;text-align:center;font-size:13.5px;font-weight:700;color:#2A2420;font-variant-numeric:tabular-nums;font-family:inherit;-moz-appearance:textfield}
.stepper .qv::-webkit-outer-spin-button,.stepper .qv::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .qv:focus{color:var(--brand)}
.addrow{padding:12px 13px 14px}
.addbtn{width:100%;height:38px;border-radius:999px;border:1px solid #F2C3AE;background:#fff;color:var(--brand2);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.addbtn:active{background:var(--soft)}
.empty{padding:34px 16px;display:none;flex-direction:column;align-items:center;text-align:center}
.empty.on{display:flex}
.empty .eic{width:60px;height:60px;border-radius:50%;background:#F7F2EE;display:grid;place-items:center;color:#C9BDB5;margin-bottom:11px}
.empty h4{margin:0;font-size:13px;font-weight:700;color:#5C5C5F}
.empty p{margin:6px 0 0;font-size:11px;color:#A79A91}
.dock{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-top:1px solid #F3EBE5;box-shadow:0 -4px 14px rgba(150,110,88,.06)}
.dock .sum{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px}
.dock .sum b{display:block;font-size:16px;font-weight:800;color:var(--brand);line-height:1.1;letter-spacing:-.2px}
.dock .sum span{display:block;font-size:10px;color:#A79A91;line-height:1.2}
.dock .acts{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.dock .hint{font-size:9.5px;color:#B0A49B}
.dock .btns{display:flex;align-items:center;gap:7px}
.dock .ghost,.dock .primary{height:36px;border-radius:999px;border:0;background:linear-gradient(135deg,#FB6E4E,#F03A2C);color:#fff;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(232,70,45,.24)}
.dock .ghost{padding:0 22px;min-width:84px}
.dock .primary{padding:0 28px;min-width:96px}
.homebar{height:18px;flex:0 0 18px;background:#fff;display:flex;align-items:center;justify-content:center}
.homebar i{width:134px;height:5px;border-radius:3px;background:#1D1D1F;display:block}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,10px);background:rgba(38,28,22,.88);color:#fff;font-size:11px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:all .22s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
(function () {
  var list = document.getElementById('itemList');
  var emptyBox = document.getElementById('emptyBox');
  var shopMeta = document.getElementById('shopMeta');
  var dockPrice = document.getElementById('dockPrice');
  var dockKinds = document.getElementById('dockKinds');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }
  function items() { return Array.prototype.slice.call(list.querySelectorAll('.item')); }
  function readQty(qv) { return parseInt(qv.value, 10) || 0; }
  function writeQty(qv, q) { qv.value = String(q); }
  function clampQty(raw, min, max) {
    var q = parseInt(raw, 10);
    if (isNaN(q)) return min;
    if (q < min) return min;
    if (q > max) return max;
    return q;
  }
  function syncRow(row) {
    var qv = row.querySelector('.qv');
    var max = parseInt(row.getAttribute('data-stock'), 10) || 99;
    var q = clampQty(qv.value, 1, max);
    var price = parseFloat(row.getAttribute('data-price')) || 0;
    var unit = row.getAttribute('data-unit') || '';
    writeQty(qv, q);
    row.querySelector('.minus').disabled = q <= 1;
    row.querySelector('.plus').disabled = q >= max;
    row.classList.toggle('picked', q > 0);
    row.querySelector('.sub').innerHTML = '<small>¥</small>' + (price * q).toFixed(2) + '<em>' + unit + '</em>';
  }
  function refresh() {
    var rows = items();
    var kinds = rows.length;
    var total = 0;
    rows.forEach(function (row) {
      var price = parseFloat(row.getAttribute('data-price')) || 0;
      total += price * readQty(row.querySelector('.qv'));
    });
    shopMeta.textContent = kinds ? ('已选 ' + kinds + ' 种商品 · 最近编辑刚刚') : '暂无商品 · 可继续添加';
    dockPrice.textContent = '¥' + total.toFixed(2);
    dockKinds.textContent = '已选 ' + kinds + ' 种商品';
    emptyBox.classList.toggle('on', kinds === 0);
  }
  items().forEach(syncRow);
  refresh();
  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var row = btn.closest('.item');
    if (!row) return;
    var qv = row.querySelector('.qv');
    var q = readQty(qv) || 1;
    var max = parseInt(row.getAttribute('data-stock'), 10) || 99;
    if (btn.classList.contains('plus')) {
      if (q >= max) { showToast('库存不足，最多可购 ' + max + ' 件'); return; }
      writeQty(qv, q + 1); syncRow(row); refresh();
    } else if (btn.classList.contains('minus')) {
      if (q <= 1) { showToast('数量最少保留 1 件，可点击删除移除'); return; }
      writeQty(qv, q - 1); syncRow(row); refresh();
    } else if (btn.classList.contains('del')) {
      row.remove(); refresh(); showToast('已从当前订单移除');
    }
  });
  list.addEventListener('focusin', function (e) {
    if (!e.target.classList.contains('qv')) return;
    e.target.select();
  });
  list.addEventListener('input', function (e) {
    if (!e.target.classList.contains('qv')) return;
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  });
  list.addEventListener('change', function (e) {
    if (!e.target.classList.contains('qv')) return;
    var row = e.target.closest('.item');
    if (!row) return;
    var max = parseInt(row.getAttribute('data-stock'), 10) || 99;
    var q = clampQty(e.target.value, 1, max);
    if (parseInt(e.target.value, 10) > max) showToast('库存不足，最多可购 ' + max + ' 件');
    if (!e.target.value || parseInt(e.target.value, 10) < 1) showToast('数量最少为 1');
    writeQty(e.target, q);
    syncRow(row);
    refresh();
  });
  list.addEventListener('keydown', function (e) {
    if (!e.target.classList.contains('qv')) return;
    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  });
  document.getElementById('orderTip').addEventListener('click', function () {
    showToast('选品订单可继续编辑，保存后最多保留 10 天');
  });
  document.getElementById('saveBtn').addEventListener('click', function () {
    if (!items().length) { showToast('请先添加商品'); return; }
    showToast('已保存到选品订单');
  });
})();
</script>
</body>
</html>
