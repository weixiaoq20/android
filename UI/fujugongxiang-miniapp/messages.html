*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:#EBE4DE;display:flex;align-items:center;justify-content:center}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:0;background:none}
.app{width:100%;height:100%;max-width:393px;max-height:852px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#FCE4E1 0%,#FBE9E4 16%,#FDF7F4 34%,#FFFDFC 48%,#FFFDFC 100%);position:relative}
.status{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:16px;font-weight:700;letter-spacing:.2px;color:#1B1B1D}
.si{display:flex;align-items:center;gap:5px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}

.hidden{display:none!important}
.msghead{padding:2px 14px 0;flex:0 0 auto}
.readall{height:32px;padding:0 14px;border-radius:999px;background:#fff;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#2A2420;box-shadow:0 4px 12px rgba(180,120,90,.08)}
.quickrow{display:flex;justify-content:space-between;padding:14px 16px 8px}
.quick{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;width:84px}
.qico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 3px 10px rgba(150,110,88,.06);border:1px solid #FBE7E0;background:radial-gradient(circle at 50% 42%,#FDE7E4 0%,#FCEBEA 60%,#FDF2F1 100%)!important}
.qico:after{content:"";position:absolute;left:10px;top:7px;width:20px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);filter:blur(1px)}
.qico svg{position:relative;z-index:1}
.quick span{font-size:12px;color:#3F342C;font-weight:600;letter-spacing:-.2px}
.qbadge{position:absolute;top:-3px;right:8px;min-width:19px;height:19px;border-radius:10px;background:#E8392C;color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;border:2px solid #FDF6F2;z-index:3;padding:0 4px}
.pushbanner{display:flex;align-items:center;gap:8px;margin:4px 12px 10px;background:#fff;border-radius:999px;padding:7px 8px 7px 13px;box-shadow:0 5px 16px rgba(232,70,45,.07);height:44px}
.pushbanner .bell{flex:0 0 21px;display:grid;place-items:center}
.pushtxt{flex:1;font-size:12.5px;font-weight:600;color:#3E332B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.openbtn{height:28px;padding:0 13px;border-radius:999px;background:linear-gradient(135deg,#FB6E4E,#F03A2C);color:#fff;font-size:11.5px;font-weight:700;flex:0 0 auto;box-shadow:0 3px 8px rgba(232,70,45,.22)}
.closebtn{width:25px;height:25px;border-radius:50%;background:#F4F1EF;display:grid;place-items:center;flex:0 0 25px}
.mlist{background:#fff;border-radius:16px;margin:0 12px;overflow:hidden;box-shadow:0 6px 20px rgba(196,110,72,.06)}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 14px;position:relative;min-height:64px}
.mrow + .mrow{border-top:1px solid #F7F1EC}
.mrow:active{background:#FFFBF8}
.mico{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;flex:0 0 43px;position:relative}
.mavatar{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:0 0 44px;background:#F1E4D8}
.mavatar svg{width:100%;height:100%;display:block}
.mi{flex:1;min-width:0;line-height:1.35}
.mtop{display:flex;align-items:center;gap:5px}
.mtop b{font-size:13.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmsg{font-size:11.5px;color:#9C8F85;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.mtime{font-size:9.5px;color:#B2A69C;white-space:nowrap}
.mbadge{min-width:18px;height:18px;border-radius:9px;background:#E8392C;color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;border:1.5px solid #fff;font-style:normal}
.grouptitle{height:32px;background:#FFF8F5;display:flex;align-items:center;padding:0 14px;font-size:10.5px;color:#A79A90;letter-spacing:.2px}
.sysrow{display:flex;align-items:stretch;background:#FFF7F4;border-top:1px solid #F7F1EC;min-height:74px}
.sysleft{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:11px 10px 11px 14px}
.sysacts{display:flex;flex:0 0 150px}
.sysact{flex:1;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.sysact.top{background:#7C93B4}
.sysact.hide{background:linear-gradient(135deg,#FB6E4E,#F03A2C)}
.sysleft .mi{min-width:0}
.sysnote{font-size:9px;color:#B08A78;margin-top:2px}
.endspace{height:16px}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,10px);background:rgba(38,28,22,.88);color:#fff;font-size:11px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:all .22s;z-index:50;white-space:nowrap;backdrop-filter:blur(6px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabbar{flex:0 0 58px;background:#fff;border-top:1px solid #F0EDEA;display:flex;padding:6px 3px 0;position:relative;z-index:30}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#6D7480;font-size:13px;font-weight:500;position:relative;text-decoration:none;letter-spacing:-.2px}
.tabbar a.on{color:#F2452E;font-weight:700}
.ti{width:38px;height:28px;display:grid;place-items:center;border-radius:50%;position:relative;transition:background .2s}
.tabbar a.on .ti{background:radial-gradient(circle at 50% 58%,#FDE0D8 0%,rgba(253,224,216,0) 72%)}
.badge{position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#E8392C;color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;font-style:normal}
.homebar{height:18px;flex:0 0 18px;background:#fff;display:flex;align-items:center;justify-content:center}
.homebar i{width:134px;height:5px;border-radius:3px;background:#1D1D1F;display:block}

<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  function readAll() {
    document.querySelectorAll('.mbadge, .qbadge, .tabbar .badge').forEach(function (b) { b.remove(); });
    showToast('全部消息已读');
  }

  function closePush() {
    document.getElementById('pushBanner').classList.add('hidden');
  }

  function openPush() {
    showToast('已开启微信订单推送');
  }

  function pinChat() {
    showToast('已置顶系统公告');
  }

  function hideChat() {
    document.getElementById('sysRow').classList.add('hidden');
    showToast('已设为不显示');
  }
