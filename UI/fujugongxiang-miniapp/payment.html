<!DOCTYPE html>

<html class="w-full h-full overflow-hidden" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>福聚贡翔 · 收银台</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<style>
:root{--brand:#E23A2E;--brand2:#FB6E4E;--ink:#1C1C1E;--ink2:#5C5C5F;--muted:#9A9AA0;--line:#F1E9E3;--soft:#FFF6F3;--shadow:0 6px 18px rgba(120,60,50,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:#EBE4DE;display:flex;align-items:center;justify-content:center}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:0;background:none}
.app{width:100%;height:100%;max-width:393px;max-height:852px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#FCE4E1 0%,#FBE9E4 16%,#FDF7F4 34%,#FFFDFC 48%,#FFFDFC 100%);position:relative}
.status{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:16px;font-weight:700;letter-spacing:.2px;color:#1B1B1D}
.si{display:flex;align-items:center;gap:5px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.navbar{flex:0 0 44px;display:flex;align-items:center;justify-content:center;position:relative}
.navbar h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px}
.navbar a{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#2A2420}
.hidden{display:none!important}
/* 金额 */
.amount{background:#fff;margin:0 12px;border-radius:18px;padding:22px 16px 18px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.amount:before{content:"";position:absolute;right:-28px;top:-28px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#FDE7E4 0%,#FCEBEA 58%,#FDF2F1 82%,rgba(253,242,241,0) 100%)}
.amount .lb{font-size:11.5px;color:#9A8C82;position:relative}
.amount .num{font-size:36px;font-weight:800;color:#1C1C1E;letter-spacing:-1.2px;margin-top:6px;position:relative}
.amount .num small{font-size:16px;font-weight:700;margin-right:2px}
.amount .mt{font-size:10.5px;color:#B0A49B;margin-top:6px;position:relative}
.amount .cd{display:inline-flex;align-items:center;gap:4px;margin-top:10px;background:#FFF6F3;color:#EE4A2F;font-size:10.5px;border-radius:999px;padding:4px 11px;position:relative;border:1px solid #FAD3C6}
/* 支付方式 */
.grp{background:#fff;margin:12px 12px 0;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.grp .gt{font-size:11px;color:#9A8C82;padding:11px 13px 2px}
.opt{display:flex;align-items:center;gap:10px;padding:13px;border-top:1px solid #F6EFE9;width:100%;text-align:left}
.opt:first-of-type{border-top:0}
.ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 30px}
.ico.wx{background:#EAF3EA;color:#5E9163}
.ico.bal{background:#FFF0EB;color:#EE4A2F}
.ico.card{background:#EEF0F6;color:#6B7A9E}
.ico.other{background:#FFF0EB;color:#EE4A2F}
.opt .nm{font-size:13px;font-weight:600}
.opt .ds{font-size:10px;color:#A79A91;margin-top:2px}
.opt .rt{margin-left:auto;display:flex;align-items:center;gap:7px}
.opt .rt small{font-size:10.5px;color:#A79A91}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid #D9CCC3;display:grid;place-items:center;flex:0 0 18px}
.dot.on{border-color:#EE4A2F;background:linear-gradient(135deg,#FB6E4E,#F03A2C)}
.dot.on:after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.tip{display:flex;align-items:flex-start;gap:6px;font-size:10.5px;color:#A79A91;line-height:1.65;padding:12px 16px}
.tip svg{flex:0 0 13px;margin-top:1px;color:#C2B5AC}
.paybar{flex:0 0 auto;padding:9px 14px 14px;background:#fff;border-top:1px solid #F3EBE5}
.paynow{width:100%;height:44px;border-radius:999px;background:linear-gradient(135deg,#FB6E4E,#F03A2C);color:#fff;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(232,70,45,.26)}
/* 成功覆盖层 */
.done{position:absolute;inset:0;background:linear-gradient(180deg,#FCE4E1 0%,#FDF7F4 40%,#FFFDFC 100%);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px}
.done .ok{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#FDE7E4,#FCEBEA 70%,#FDF2F1);display:grid;place-items:center;color:#EE4A2F;margin-bottom:16px}
.done h2{margin:0;font-size:18px;font-weight:800}
.done p{margin:8px 0 0;font-size:12px;color:#8A7C72;text-align:center;line-height:1.7}
.done .am{margin-top:14px;font-size:22px;font-weight:800;color:#1C1C1E}
.done .am small{font-size:12px;color:#9A8C82;font-weight:500;margin-right:4px}
.done .btns{display:flex;gap:10px;margin-top:26px;width:100%}
.done .btns a{flex:1;height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.done .btns a.g1{background:#fff;border:1px solid #F5E9E2;color:#8A5A45}
.done .btns a.g2{background:linear-gradient(135deg,#FB6E4E,#F03A2C);color:#fff;box-shadow:0 6px 16px rgba(232,70,45,.24)}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center">
<div class="app">
<div class="status"><span>9:41</span>
<div class="si">
<svg fill="#2A211B" height="11" viewbox="0 0 17 11" width="17"><rect height="4" rx="1" width="3" x="0" y="7"></rect><rect height="6" rx="1" width="3" x="4.5" y="5"></rect><rect height="8.5" rx="1" width="3" x="9" y="2.5"></rect><rect height="11" rx="1" width="3" x="13.5" y="0"></rect></svg>
<svg fill="#2A211B" height="11" viewbox="0 0 15 11" width="15"><path d="M7.5 10.2 5.4 7.9a3.1 3.1 0 0 1 4.2 0zM2.6 5.1 1 3.4a9.4 9.4 0 0 1 13 0l-1.6 1.7a7 7 0 0 0-9.8 0z"></path></svg>
<svg height="11" viewbox="0 0 24 11" width="24"><rect fill="none" height="10" rx="3" stroke="#2A211B" stroke-opacity=".5" width="20" x=".5" y=".5"></rect><rect fill="#2A211B" height="7" rx="1.6" width="16" x="2" y="2"></rect><rect fill="#2A211B" height="4" opacity=".6" rx=".7" width="1.5" x="22" y="3.5"></rect></svg>
</div>
</div>
<div class="navbar">
<a aria-label="返回" href="order-confirm.html"><svg fill="none" height="21" viewbox="0 0 24 24" width="21"><path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1"></path></svg></a>
<h1>收银台</h1>
</div>
<div class="scroll">
<div class="amount">
<div class="lb">需支付金额</div>
<div class="num"><small>¥</small>71.80</div>
<div class="mt">订单 2026 1106 0032 · 福聚贡翔演示店</div>
<div class="cd" id="cdBar">
<svg fill="none" height="11" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="11"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2" stroke-linecap="round"></path></svg>
        请在 <b id="cdPay">14 分 58 秒</b> 内完成支付，超时自动关闭订单并释放库存、退回优惠券
      </div>
</div>
<div class="grp">
<div class="gt">支付方式</div>
<button class="opt" data-pay="1">
<span class="ico wx">微</span>
<span><span class="nm">微信担保支付</span><span class="ds" style="display:block">平台托管货款，确认收货后分账给商家</span></span>
<span class="rt"><span class="dot on"></span></span>
</button>
</div>
<div class="tip">
<svg fill="none" height="13" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="13"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.6v.2" stroke-linecap="round"></path></svg>
      支付成功后货款由平台托管，商家发货、你确认收货后自动分账。生鲜商品支持坏果包赔，售后可在「我的订单」中发起。
    </div>
</div>
<div class="paybar"><button class="paynow" id="paynow">确认支付 ¥71.80</button></div>
<div class="done hidden" id="done">
<div class="ok"><svg fill="none" height="30" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="30"><path d="m5 12.5 4.6 4.6L19 7.5"></path></svg></div>
<h2>支付成功</h2>
<p>福聚贡翔演示店已收到订单<br/>预计 11 月 7 日送达</p>
<div class="am"><small>实付</small>¥71.80</div>
<div class="btns">
<a class="g1" href="orders.html">查看订单</a>
<a class="g2" href="home.html">返回首页</a>
</div>
</div>
</div>
<script>
  var opts = document.querySelectorAll('.opt[data-pay]');
  opts.forEach(function (o) {
    o.addEventListener('click', function () {
      document.querySelectorAll('.dot').forEach(function (d) { d.classList.remove('on'); });
      o.querySelector('.dot').classList.add('on');
    });
  });
  document.getElementById('paynow').addEventListener('click', function () {
    var btn = this;
    btn.textContent = '支付中...';
    setTimeout(function () {
      document.getElementById('done').classList.remove('hidden');
    }, 700);
  });

  (function () {
    var left = 14 * 60 + 58;
    var el = document.getElementById('cdPay');
    var paid = false;
    document.getElementById('paynow').addEventListener('click', function () { paid = true; }, true);
    function render() {
      var m = Math.floor(left / 60);
      var s = left % 60;
      el.textContent = m + ' 分 ' + (s < 10 ? '0' + s : s) + ' 秒';
    }
    render();
    var timer = setInterval(function () {
      if (paid) { clearInterval(timer); return; }
      if (left > 0) { left--; render(); return; }
      clearInterval(timer);
      el.textContent = '00 分 00 秒';
      var bar = document.getElementById('cdBar');
      if (bar) { bar.textContent = '支付超时，订单已自动关闭，库存与优惠券已释放（演示）'; }
      document.getElementById('paynow').textContent = '订单已关闭';
      document.getElementById('paynow').setAttribute('disabled', 'disabled');
    }, 1000);
  })();
</script>
</body>
</html>
