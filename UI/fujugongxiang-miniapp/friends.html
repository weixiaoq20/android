<!DOCTYPE html>

<html class="w-full h-full overflow-hidden" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>福聚贡翔 · 我的好友</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<style>
:root{--brand:#E23A2E;--brand2:#FB6E4E;--ink:#1C1C1E;--ink2:#5C5C5F;--muted:#9A9AA0;--line:#F1E9E3;--soft:#FFF6F3;--shadow:0 6px 18px rgba(120,60,50,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:#EBE4DE;display:flex;align-items:center;justify-content:center}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:0;background:none}
.app{width:100%;height:100%;max-width:393px;max-height:852px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#FCE4E1 0%,#FBE9E4 16%,#FDF7F4 34%,#FFFDFC 48%,#FFFDFC 100%);position:relative}
.status{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:16px;font-weight:700;letter-spacing:.2px;color:#1B1B1D}
.si{display:flex;align-items:center;gap:5px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 12px 14px}
.hidden{display:none!important}
.navbar{flex:0 0 46px;display:flex;align-items:center;justify-content:center;position:relative}
.navbar h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px}
.navbar a{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#2A2420}
/* 搜索 */
.search{display:flex;align-items:center;gap:6px;height:40px;background:#fff;border:1px solid #F5E7E1;border-radius:999px;padding:0 14px;margin:2px 0 12px;box-shadow:0 4px 12px rgba(190,120,90,.06)}
.search input{flex:1;border:0;outline:none;background:transparent;font-size:13px;color:#1C1C1E;font-family:inherit;min-width:0}
.search input::placeholder{color:#B6B6BC}
/* 快捷 */
.quick{display:flex;background:#fff;border-radius:14px;padding:12px 0;margin-bottom:12px;box-shadow:var(--shadow)}
.quick a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:#6E6157;position:relative}
.quick a+ a:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:#F6EDE7}
.quick .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#FDE7E4,#FCEBEA 70%,#FDF2F1);color:#EE4A2F}
.quick .dot{position:absolute;right:16px;top:-3px;min-width:15px;height:15px;border-radius:8px;background:#E8392C;color:#fff;font-size:8px;font-weight:700;display:grid;place-items:center;border:1.5px solid #fff;padding:0 2px;font-style:normal}
/* tabs */
.tabs{display:flex;gap:6px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font-size:11.5px;padding:6px 14px;border-radius:999px;color:#8A7C72;background:#fff;border:1px solid #F5E9E2}
.tabs button.on{background:linear-gradient(135deg,#FB6E4E,#F03A2C);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 4px 12px rgba(232,70,45,.2)}
/* 申请 */
.apply{background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.apply .ah{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8A7C72;margin-bottom:9px}
.apply .ah b{color:#5E5249;font-size:12px}
.apply .row{display:flex;align-items:center;gap:8px;padding:7px 0}
.apply .row+.row{border-top:1px dashed #F2E9E3}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.av.a{background:#FFEFEB;color:#EE4A2F}
.av.b{background:#EFF2E8;color:#7D8F63}
.av.c{background:#F6E9EA;color:#B07783}
.av.d{background:#EEF1F6;color:#7E90AE}
.apply .nm{font-size:12px;font-weight:600}
.apply .ds{font-size:9.5px;color:#A79A91;margin-top:2px}
.apply .ops{margin-left:auto;display:flex;gap:6px}
.apply .ops button{font-size:10.5px;border-radius:999px;padding:4px 11px;border:1px solid #F7A392;color:#EE4A2F;background:#FFF6F3}
.apply .ops button.ok{background:linear-gradient(135deg,#FB6E4E,#F03A2C);color:#fff;border-color:transparent;box-shadow:0 3px 8px rgba(232,70,45,.2)}
/* 好友列表 */
.fl{display:flex;align-items:center;gap:9px;background:#fff;border-radius:13px;padding:10px 11px;margin-bottom:8px;box-shadow:0 4px 14px rgba(120,60,50,.05)}
.fl .nm{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.fl .nm em{font-style:normal;font-size:8.5px;color:#EE4A2F;background:#FFF6F3;border:1px solid #F7A392;border-radius:999px;padding:0 5px;font-weight:600}
.fl .dt{font-size:9.5px;color:#A79A91;margin-top:3px}
.fl .rt{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.fl .rt a{font-size:10.5px;color:#EE4A2F;border:1px solid #F7A392;background:#FFF6F3;border-radius:999px;padding:4px 10px}
.sectitle{font-size:10.5px;color:#A79A91;padding:6px 3px 8px}
.invite{display:flex;align-items:center;gap:9px;background:linear-gradient(120deg,#FFF1EB,#FFE7DE);border:1px solid #F8CDBD;border-radius:14px;padding:11px 12px;margin-top:4px}
.invite .ic{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#FE9E7E,#F2452E);color:#fff;display:grid;place-items:center;flex:0 0 32px}
.invite b{display:block;font-size:12px;color:#B3411F}
.invite span{display:block;font-size:9.5px;color:#C08065;margin-top:2px}
.invite a{margin-left:auto;font-size:10.5px;color:#fff;background:linear-gradient(135deg,#FB6E4E,#F03A2C);border-radius:999px;padding:5px 12px;font-weight:700;flex:0 0 auto}
.homebar{height:18px;flex:0 0 18px;background:#fff;display:flex;align-items:center;justify-content:center}
.homebar i{width:134px;height:5px;border-radius:3px;background:#1D1D1F;display:block}
</style>
</head>

<script>
  (function () {
    var tabs = document.querySelectorAll('#tabs button');
    tabs.forEach(function (b) {
      b.addEventListener('click', function () {
        tabs.forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
    });
    var box = document.getElementById('applyBox');
    box.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('.row');
        var who = row.querySelector('.nm').textContent;
        if (btn.getAttribute('data-act') === 'yes') {
          var fl = document.createElement('div');
          fl.className = 'fl';
          fl.innerHTML = '<span class="av d">' + who.slice(0, 1) + '</span>' +
            '<div><div class="nm"></div><div class="dt">刚刚成为好友</div></div>' +
            '<div class="rt"><a href="chat-friend.html">发消息</a></div>';
          fl.querySelector('.nm').textContent = who;
          document.querySelector('.sectitle').after(fl);
        }
        row.remove();
        if (!box.querySelector('.row')) {
          var ah = box.querySelector('.ah b');
          ah.textContent = '好友申请';
          box.querySelector('.ah').lastChild.textContent = ' 已全部处理';
          box.querySelectorAll('.ah b')[0].nextSibling.textContent = ' 已全部处理';
        }
      });
    });
    var q = document.getElementById('q');
    q.addEventListener('input', function () {
      var v = q.value.trim().toLowerCase();
      document.querySelectorAll('.fl').forEach(function (f) {
        f.style.display = f.textContent.toLowerCase().indexOf(v) > -1 ? '' : 'none';
      });
    });
  })();
</script>
