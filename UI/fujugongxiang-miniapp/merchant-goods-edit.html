<!DOCTYPE html>

<html class="w-full h-full overflow-hidden" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>福聚贡翔 · 编辑商品</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<style>
:root{--brand:#E23A2E;--brand2:#EE4A2F;--ink:#2A2420;--ink2:#5C5C5F;--muted:#9A9AA0;--line:#F1E9E3;--soft:#FFF6F3;--shadow:0 8px 20px rgba(150,110,88,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:#EBE4DE;display:flex;align-items:center;justify-content:center}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit}
html.w-full.h-full{overflow:hidden}
.app{width:100%;height:100%;max-width:393px;max-height:852px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#FCE4E1 0%,#FBE9E4 16%,#FDF7F4 34%,#FFFDFC 48%,#FFFDFC 100%);position:relative}
.status{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:16px;font-weight:700;letter-spacing:.2px;color:#1B1B1D}
.si{display:flex;align-items:center;gap:5px}
.topbar{flex:0 0 46px;display:grid;grid-template-columns:30px 1fr 30px;align-items:center;padding:0 14px}
.topbar h1{margin:0;font-size:16px;font-weight:700;color:#231C18;letter-spacing:-.2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 3px 9px rgba(150,90,70,.08)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 14px 12px}
.card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:13px 12px;margin-top:10px}
.card h3{margin:0 0 9px;font-size:11.5px;font-weight:800;color:#2A2420;display:flex;align-items:center;gap:4px;white-space:nowrap}
.card h3 small{font-size:8px;color:#B2A69C;font-weight:400;margin-left:auto;white-space:nowrap}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.card-h h3{margin:0}
.req{color:#EE4A2F}
.field{margin-bottom:9px}
.field:last-child{margin-bottom:0}
.field label{display:flex;align-items:center;gap:3px;font-size:9px;color:#8E8076;margin-bottom:4px;white-space:nowrap}
.lab-note{font-size:8px;color:#B2A69C;font-weight:400;margin-left:auto}
.inp{width:100%;height:38px;border-radius:10px;border:1px solid #F1E5DB;background:#FDFBF9;padding:0 10px;font-size:12px;color:#2A2420;outline:none;transition:border-color .16s,box-shadow .16s,background .16s}
.inp::placeholder{color:#C4B7AC}
.inp:focus{border-color:#F7A392;background:#fff;box-shadow:0 0 0 3px rgba(251,110,78,.1)}
.inp.err{border-color:#EE4A2F;background:#FFF5F2;box-shadow:0 0 0 3px rgba(238,74,47,.12)}
.area{height:auto;min-height:68px;padding:9px 10px;line-height:1.6;font-size:11.5px;resize:none;display:block}
.two{display:flex;gap:8px}
.two .field{flex:1;min-width:0}
.chips{display:flex;gap:6px}
.chip{flex:1;height:32px;border-radius:999px;border:1px solid #F1E5DB;background:#FDFBF9;font-size:10.5px;color:#5C5C5F;font-weight:600;white-space:nowrap;transition:all .16s;padding:0 4px}
.chip.on{background:#FFEFEB;border-color:#F7A392;color:#EE4A2F}
.catpick{width:100%;height:38px;border-radius:10px;border:1px solid #F1E5DB;background:#FDFBF9;padding:0 10px;display:flex;align-items:center;gap:8px;text-align:left}
.catpick:active{background:#FFF8F5}
.catpick .cval{flex:1;min-width:0;font-size:12px;color:#C4B7AC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catpick .cval.on{color:#2A2420;font-weight:600}
.catpick .carr{flex:0 0 12px;color:#C9BDB5}
.catpick.err{border-color:#EE4A2F;background:#FFF5F2;box-shadow:0 0 0 3px rgba(238,74,47,.12)}
.imgs{display:flex;gap:7px;align-items:stretch}
.imgc,.slot,.up{flex:0 0 calc((100% - 21px)/4);width:calc((100% - 21px)/4);aspect-ratio:1/1;border-radius:11px;position:relative;overflow:hidden}
.imgc.kiwi{background:radial-gradient(circle at 38% 32%,#D9C08A 0 17%,transparent 18%),radial-gradient(circle at 66% 62%,#7E9B4A 0 26%,transparent 27%),linear-gradient(140deg,#EAF0D8,#C2D59B 55%,#8FAF68)}
.imgc.orange{background:radial-gradient(circle at 36% 30%,#FFD98D 0 18%,transparent 19%),radial-gradient(circle at 68% 64%,#FF9F2E 0 26%,transparent 27%),linear-gradient(140deg,#FBF0DC,#E9CB9C 48%,#C79E68)}
.imgc.red{background:radial-gradient(circle at 34% 34%,#C46146 0 24%,transparent 25%),radial-gradient(circle at 70% 70%,#7C2A1A 0 22%,transparent 23%),linear-gradient(150deg,#F5E2DA,#D8A08A 48%,#A16A52)}
.slot{border:1px dashed #ECD9CD;background:#FFFBF8;display:grid;place-items:center;color:#DCC7B9}
.up{border:1px dashed #E9C4B3;background:#FFF8F4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#E4674F;font-size:7.5px;font-weight:700;white-space:nowrap;line-height:1.1;padding:0}
.up .plus{font-size:14px;line-height:1;font-weight:400}
.tag{position:absolute;left:4px;bottom:4px;font-size:6.5px;color:#fff;background:rgba(40,30,25,.45);border-radius:999px;padding:1px 4px;white-space:nowrap;line-height:1.4}
.addsku{font-size:9.5px;font-weight:700;color:#EE4A2F;white-space:nowrap;background:#FFF1EB;border-radius:999px;padding:5px 10px;flex:0 0 auto}
.sku{background:#FFFBF8;border:1px solid #F6EBE3;border-radius:12px;padding:7px;margin-bottom:7px}
.sku:last-child{margin-bottom:0}
.skumain{display:flex;gap:5px;align-items:center}
.skumain input{height:30px;border-radius:8px;border:1px solid #F1E5DB;background:#fff;padding:0 7px;font-size:9.5px;outline:none;min-width:0;color:#2A2420;transition:border-color .16s,box-shadow .16s}
.skumain input:focus{border-color:#F7A392;box-shadow:0 0 0 2px rgba(251,110,78,.1)}
.skumain input.err{border-color:#EE4A2F;background:#FFF5F2;box-shadow:0 0 0 2px rgba(238,74,47,.14)}
.sname{flex:1.25}
.sprice{flex:.8}
.sstock{flex:.8}
.rm{flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:#FFEFEB;color:#EE4A2F;font-size:12px;line-height:1;display:grid;place-items:center;padding:0}
.skusub{display:flex;align-items:center;gap:5px;margin-top:5px}
.skusub span{font-size:8px;color:#A99C92;white-space:nowrap}
.skusub input{width:64px;height:22px;border-radius:7px;border:1px solid #F3E7DF;background:#fff;padding:0 6px;font-size:9px;outline:none;color:#5C5C5F}
.remark{font-size:8.5px;color:#A99C92;line-height:1.55;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.switchrow .sl{font-size:11px;color:#2A2420;font-weight:600;white-space:nowrap}
.sw{width:36px;height:20px;border-radius:999px;background:#EDE3DB;position:relative;transition:background .18s;flex:0 0 36px}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:left .18s}
.sw[data-on="1"]{background:linear-gradient(135deg,#FB6E4E,#F03A2C)}
.sw[data-on="1"] i{left:18px}
.divider{height:1px;background:#F6EDE6;margin:9px 0}
.inlinerow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0 0}
.il{font-size:10px;color:#5C5C5F;font-weight:600;white-space:nowrap}
.ratio{position:relative;flex:0 0 84px;display:block}
.ratio input{width:84px;height:30px;border-radius:9px;border:1px solid #F1E5DB;background:#FDFBF9;padding:0 24px 0 9px;font-size:10.5px;outline:none;color:#2A2420}
.ratio input:focus{border-color:#F7A392;box-shadow:0 0 0 2px rgba(251,110,78,.1)}
.ratio em{position:absolute;right:9px;top:0;height:30px;display:flex;align-items:center;font-size:9px;color:#A99C92;font-style:normal}
.subh{display:flex;align-items:center;gap:6px;margin:0 0 7px;font-size:10.5px;font-weight:700;color:#2A2420;white-space:nowrap}
.tagsm{font-size:8px;font-weight:600;color:#C2755F;background:#FFF1EB;border-radius:999px;padding:2px 7px;white-space:nowrap}
.pinentry{width:100%;height:34px;border-radius:10px;border:1px dashed #F7A392;background:#FFF8F5;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:10px;font-weight:700;color:#EE4A2F;margin-top:2px}
.pe-r{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:600}
.pe-r i{font-style:normal;font-size:12px;line-height:1;transition:transform .18s}
.pinentry.open .pe-r i{transform:rotate(90deg)}
.pinbox{margin-top:6px}
.pinrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.pinrow>span:first-child{font-size:9px;color:#5C5C5F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinrow .ratio{flex:0 0 78px}
.pinrow .ratio input{width:78px;height:28px}
.pinrow .ratio em{height:28px}
.foot{flex:0 0 auto;padding:10px 14px 12px;background:linear-gradient(180deg,rgba(255,253,252,0),#FFFDFC 30%);display:flex;flex-direction:column;gap:7px}
.mainbtn{width:100%;height:44px;border-radius:999px;background:linear-gradient(135deg,#FB6E4E,#F03A2C);color:#fff;font-size:13px;font-weight:700;box-shadow:0 8px 18px rgba(232,70,45,.26);white-space:nowrap}
.draftbtn{width:100%;height:38px;border-radius:999px;background:#FFEFEB;color:#EE4A2F;font-size:11.5px;font-weight:700;border:1px solid #FBD9CD;white-space:nowrap}
.tip{position:absolute;left:14px;right:14px;bottom:122px;background:#FFF1EB;border:1px solid #FBD3C6;color:#D8391F;font-size:10px;font-weight:600;border-radius:12px;padding:8px 11px;text-align:center;opacity:0;transform:translateY(6px);pointer-events:none;transition:all .2s;z-index:30;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 16px rgba(180,80,50,.1)}
.tip.show{opacity:1;transform:translateY(0)}
.homebar{height:18px;flex:0 0 18px;background:#FFFDFC;display:flex;align-items:center;justify-content:center}
.homebar i{width:134px;height:5px;border-radius:3px;background:#1D1D1F;display:block}
.toast{position:absolute;left:50%;bottom:168px;transform:translate(-50%,10px);background:rgba(38,28,22,.88);color:#fff;font-size:11px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:all .22s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center">
<div class="app">
<div class="status">
<span>9:41</span>
<div class="si">
<svg fill="#2A211B" height="11" viewbox="0 0 17 11" width="17"><rect height="4" rx="1" width="3" x="0" y="7"></rect><rect height="6" rx="1" width="3" x="4.5" y="5"></rect><rect height="8.5" rx="1" width="3" x="9" y="2.5"></rect><rect height="11" rx="1" width="3" x="13.5" y="0"></rect></svg>
<svg fill="#2A211B" height="11" viewbox="0 0 15 11" width="15"><path d="M7.5 10.2 5.4 7.9a3.1 3.1 0 0 1 4.2 0zM2.6 5.1 1 3.4a9.4 9.4 0 0 1 13 0l-1.6 1.7a7 7 0 0 0-9.8 0z"></path></svg>
<svg height="11" viewbox="0 0 24 11" width="24"><rect fill="none" height="10" rx="3" stroke="#2A211B" stroke-opacity=".5" width="20" x=".5" y=".5"></rect><rect fill="#2A211B" height="7" rx="1.6" width="16" x="2" y="2"></rect><rect fill="#2A211B" height="4" opacity=".6" rx=".7" width="1.5" x="22" y="3.5"></rect></svg>
</div>
</div>
<div class="topbar">
<a aria-label="返回商品管理" class="back" href="merchant-goods.html">
<svg fill="none" height="16" viewbox="0 0 24 24" width="16"><path d="m15 5-7 7 7 7" stroke="#2A2420" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg>
</a>
<h1 id="pageTitle">编辑商品</h1>
<span style="width:30px"></span>
</div>
<div class="scroll">
<div class="pad">
<div class="card">
<h3>商品基本信息 <small>必填项</small></h3>
<div class="field">
<label>商品名称<span class="req">*</span></label>
<input class="inp" id="gName" maxlength="40" placeholder="如：蒲江红心猕猴桃 5斤大果 现摘现发"/>
</div>
<div class="two">
<div class="field">
<label>单价（元）<span class="req">*</span></label>
<input class="inp" id="gPrice" inputmode="decimal" placeholder="39.90"/>
</div>
<div class="field">
<label>总库存<span class="req">*</span></label>
<input class="inp" id="gStock" inputmode="numeric" placeholder="3200"/>
</div>
</div>
<div class="field">
<label>商品类目<span class="req">*</span><span class="lab-note">平台一二级类目 · 仅选二级</span></label>
<a class="catpick" id="gCatPick" href="merchant-category-pick.html">
<span class="cval" id="gCatVal">请选择二级类目</span>
<svg class="carr" fill="none" height="12" viewBox="0 0 24 24" width="12"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</a>
<input type="hidden" id="gCatKey" value=""/>
<input type="hidden" id="gCatName" value=""/>
</div>
<div class="field">
<label>主图<span class="lab-note">最多 3 张 · 首图为主图</span></label>
<div class="imgs" id="mainImgs">
<div class="imgc kiwi"><span class="tag">主图1</span></div>
<div class="imgc orange"><span class="tag">主图2</span></div>
<div class="imgc red"><span class="tag">主图3</span></div>
<button aria-label="上传主图" class="up" id="upBtn" onclick="addMainImg()"><span class="plus">+</span><span>上传主图</span></button>
</div>
</div>
<div class="field">
<label>商品详情</label>
<textarea class="inp area" id="gDetail" maxlength="300" placeholder="产地、规格、发货时效、售后说明…"></textarea>
</div>
</div>
<div class="card">
<div class="card-h">
<h3>商品规格 / SKU</h3>
<button class="addsku" onclick="addSku()">+ 添加规格</button>
</div>
<div id="skuList">
<div class="sku">
<div class="skumain">
<input class="sname" placeholder="规格名" value="5斤大果"/>
<input class="sprice" inputmode="decimal" placeholder="零售价" value="39.90"/>
<input class="sstock" inputmode="numeric" placeholder="库存" value="3200"/>
<button aria-label="删除规格" class="rm" onclick="removeSku(this)">×</button>
</div>
<div class="skusub"><span>批发价（选填）</span><input class="wprice" inputmode="decimal" placeholder="0.00" value="36.00"/></div>
</div>
<div class="sku">
<div class="skumain">
<input class="sname" placeholder="规格名" value="5斤中果"/>
<input class="sprice" inputmode="decimal" placeholder="零售价" value="34.90"/>
<input class="sstock" inputmode="numeric" placeholder="库存" value="1800"/>
<button aria-label="删除规格" class="rm" onclick="removeSku(this)">×</button>
</div>
<div class="skusub"><span>批发价（选填）</span><input class="wprice" inputmode="decimal" placeholder="0.00" value="31.50"/></div>
</div>
<div class="sku">
<div class="skumain">
<input class="sname" placeholder="规格名" value="10斤大果"/>
<input class="sprice" inputmode="decimal" placeholder="零售价" value="69.90"/>
<input class="sstock" inputmode="numeric" placeholder="库存" value="600"/>
<button aria-label="删除规格" class="rm" onclick="removeSku(this)">×</button>
</div>
<div class="skusub"><span>批发价（选填）</span><input class="wprice" inputmode="decimal" placeholder="0.00" value="63.00"/></div>
</div>
</div>
<div class="remark">规格名、零售价、库存为必填；批发价选填</div>
</div>
<div class="card">
<h3>销售与营销设置 <small>商家可配置</small></h3>
<div class="switchrow">
<div class="sl">上架销售</div>
<button aria-label="上架销售" class="sw" data-on="1" id="onSw" onclick="toggleSw(this)"><i></i></button>
</div>
<div class="field" style="margin-top:8px">
<label>保存状态</label>
<div class="chips" id="gStatus">
<button class="chip" data-v="draft">草稿</button>
<button class="chip on" data-v="online">直接上架</button>
<button class="chip" data-v="off">下架</button>
</div>
</div>
<div class="divider"></div>
<div class="switchrow">
<div class="sl">一级分销</div>
<button aria-label="一级分销" class="sw" data-on="1" id="distSw" onclick="toggleSw(this)"><i></i></button>
</div>
<div class="inlinerow">
<span class="il">佣金比例</span>
<span class="ratio"><input aria-label="佣金比例" id="distRate" inputmode="decimal" value="10"/><em>%</em></span>
</div>
<div class="remark">参与后按成交金额与比例计佣，仅一级分销</div>
<div class="divider"></div>
<div class="subh"><span>拼单</span><span class="tagsm">仅平台担保</span></div>
<div class="two">
<div class="field">
<label>成团人数<span class="req">*</span></label>
<input class="inp" id="pinNum" inputmode="numeric" value="3"/>
</div>
<div class="field">
<label>开团有效（小时）<span class="req">*</span></label>
<input class="inp" id="pinHour" inputmode="numeric" value="24"/>
</div>
</div>
<button class="pinentry" id="pinEntry" onclick="togglePin()">
<span>各 SKU 拼单价</span>
<span class="pe-r">设置<i id="pinArrow">›</i></span>
</button>
<div class="pinbox hidden" id="pinBox"></div>
<div class="remark">托管支付，成团前不发货</div>
</div>
</div>
</div>
<div class="foot">
<button class="mainbtn" onclick="submitGoods('online')">保存商品</button>
<button class="draftbtn" onclick="submitGoods('draft')">存为草稿</button>
</div>
<div class="tip" id="tip"></div>
<div class="homebar"><i></i></div>
<div class="toast" id="toast">商品已保存</div>
</div>
<script>
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1700);
  }

  function showTip(msg) {
    const t = document.getElementById('tip');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__tipTimer);
    window.__tipTimer = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }

  function toggleSw(el) {
    el.dataset.on = el.dataset.on === '1' ? '0' : '1';
  }

  function bindChips(id) {
    const box = document.getElementById(id);
    if (!box) return;
    box.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        box.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
    });
  }

  function selectChip(id, val) {
    const box = document.getElementById(id);
    if (!box) return;
    box.querySelectorAll('.chip').forEach(function (b) {
      b.classList.toggle('on', b.dataset.v === val);
    });
  }

  function slotHtml() {
    return '<div class="slot" onclick="addMainImg()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="14" rx="3" stroke="#DCC7B9" stroke-width="1.6"/><circle cx="9" cy="10.5" r="1.6" fill="#DCC7B9"/><path d="m5.5 17 4.6-4.4 3 2.8 2.4-2.2 3 3.8" stroke="#DCC7B9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  }

  function upHtml() {
    return '<button class="up" id="upBtn" onclick="addMainImg()" aria-label="上传主图"><span class="plus">+</span><span>上传主图</span></button>';
  }

  function addMainImg() {
    const box = document.getElementById('mainImgs');
    const pics = box.querySelectorAll('.imgc').length;
    if (pics >= 3) {
      showTip('最多上传 3 张主图');
      return;
    }
    const cls = ['kiwi', 'orange', 'red'][pics] || 'kiwi';
    const el = document.createElement('div');
    el.className = 'imgc ' + cls;
    el.innerHTML = '<span class="tag">主图' + (pics + 1) + '</span>';
    const slot = box.querySelector('.slot');
    const up = box.querySelector('.up');
    if (slot) {
      slot.replaceWith(el);
    } else if (up) {
      box.insertBefore(el, up);
    } else {
      box.appendChild(el);
    }
    toast('主图已添加');
  }

  function skuRowHtml(name, price, stock, whole) {
    return '<div class="sku">'
      + '<div class="skumain">'
      + '<input class="sname" placeholder="规格名" value="' + esc(name || '') + '">'
      + '<input class="sprice" placeholder="零售价" inputmode="decimal" value="' + esc(price || '') + '">'
      + '<input class="sstock" placeholder="库存" inputmode="numeric" value="' + esc(stock || '') + '">'
      + '<button class="rm" onclick="removeSku(this)" aria-label="删除规格">×</button>'
      + '</div>'
      + '<div class="skusub"><span>批发价（选填）</span><input class="wprice" inputmode="decimal" placeholder="0.00" value="' + esc(whole || '') + '"></div>'
      + '</div>';
  }

  function addSku() {
    const list = document.getElementById('skuList');
    list.insertAdjacentHTML('beforeend', skuRowHtml());
    const rows = list.querySelectorAll('.sku');
    const nameInput = rows[rows.length - 1].querySelector('.sname');
    try { nameInput.focus({ preventScroll: true }); } catch (e) { nameInput.focus(); }
    toast('已添加一行规格');
  }

  function removeSku(btn) {
    const list = document.getElementById('skuList');
    if (list.querySelectorAll('.sku').length <= 1) {
      showTip('至少保留一行规格');
      return;
    }
    btn.closest('.sku').remove();
  }

  function renderPin() {
    const box = document.getElementById('pinBox');
    const names = [];
    document.querySelectorAll('#skuList .sname').forEach(function (inp) {
      names.push(inp.value.trim() || '未命名规格');
    });
    box.innerHTML = names.map(function (n) {
      return '<div class="pinrow"><span>' + esc(n) + '</span><span class="ratio"><input inputmode="decimal" placeholder="0.00" aria-label="拼单价"><em>元</em></span></div>';
    }).join('');
  }

  function togglePin() {
    const box = document.getElementById('pinBox');
    const btn = document.getElementById('pinEntry');
    const willOpen = box.classList.contains('hidden');
    box.classList.toggle('hidden', !willOpen);
    btn.classList.toggle('open', willOpen);
    if (willOpen) renderPin();
  }

  function fail(el, msg) {
    showTip(msg);
    el.classList.add('err');
    if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    setTimeout(function () { el.classList.remove('err'); }, 2000);
    return false;
  }

  function submitGoods(mode) {
    const nameEl = document.getElementById('gName');
    const priceEl = document.getElementById('gPrice');
    const stockEl = document.getElementById('gStock');

    if (!nameEl.value.trim()) {
      fail(nameEl, '请填写商品名称');
      return;
    }

    if (mode === 'draft') {
      toast('商品已存为草稿');
      setTimeout(function () { location.href = 'merchant-goods.html'; }, 900);
      return;
    }

    const catName = document.getElementById('gCatName').value.trim();
    if (!catName) {
      fail(document.getElementById('gCatPick'), '请选择商品二级类目');
      return;
    }

    const price = priceEl.value.trim();
    if (!/^\d+(\.\d{1,2})?$/.test(price) || Number(price) <= 0) {
      fail(priceEl, '请填写有效的商品单价');
      return;
    }

    const stock = stockEl.value.trim();
    if (!/^\d+$/.test(stock)) {
      fail(stockEl, '请填写有效的总库存');
      return;
    }

    const rows = document.querySelectorAll('#skuList .sku');
    for (let i = 0; i < rows.length; i++) {
      const n = rows[i].querySelector('.sname');
      const p = rows[i].querySelector('.sprice');
      const s = rows[i].querySelector('.sstock');
      if (!n.value.trim()) {
        fail(n, '请填写第 ' + (i + 1) + ' 行规格名');
        return;
      }
      if (!/^\d+(\.\d{1,2})?$/.test(p.value.trim()) || Number(p.value) <= 0) {
        fail(p, '第 ' + (i + 1) + ' 行零售价不正确');
        return;
      }
      if (!/^\d+$/.test(s.value.trim())) {
        fail(s, '第 ' + (i + 1) + ' 行库存不正确');
        return;
      }
    }

    toast('商品已保存');
    setTimeout(function () { location.href = 'merchant-goods.html'; }, 900);
  }

  bindChips('gStatus');

  function applyPickedCategory(picked) {
    if (!picked || !picked.name) return;
    document.getElementById('gCatKey').value = picked.key || '';
    document.getElementById('gCatName').value = picked.name || '';
    var val = document.getElementById('gCatVal');
    val.textContent = picked.level1 ? (picked.level1 + ' · ' + picked.name) : picked.name;
    val.classList.add('on');
    document.getElementById('gCatPick').classList.remove('err');
  }

  function syncCatPickHref() {
    var qs = location.search || '';
    var from = 'merchant-goods-edit.html' + qs;
    var key = document.getElementById('gCatKey').value;
    var href = 'merchant-category-pick.html?from=' + encodeURIComponent(from);
    if (key) href += '&key=' + encodeURIComponent(key);
    document.getElementById('gCatPick').setAttribute('href', href);
  }

  (function init() {
    const p = new URLSearchParams(location.search);
    const isNew = p.get('mode') === 'new';
    const title = document.getElementById('pageTitle');

    if (isNew) {
      title.textContent = '新增商品';
      document.title = '福聚贡翔 · 新增商品';
      document.getElementById('gName').value = '';
      document.getElementById('gPrice').value = '';
      document.getElementById('gStock').value = '';
      document.getElementById('gDetail').value = '';
      document.getElementById('skuList').innerHTML = skuRowHtml();
      document.getElementById('mainImgs').innerHTML = slotHtml() + slotHtml() + slotHtml() + upHtml();
      selectChip('gStatus', 'online');
    } else {
      title.textContent = '编辑商品';
      document.title = '福聚贡翔 · 编辑商品';

      const name = p.get('name');
      const price = p.get('price');
      const stock = p.get('stock');
      if (name) document.getElementById('gName').value = name;
      if (price) document.getElementById('gPrice').value = price;
      if (stock) document.getElementById('gStock').value = stock;
      document.getElementById('gDetail').value = '蒲江红心猕猴桃，果园现摘，5 斤大果单果 90-110g，顺丰冷链 48 小时内发货。';
      applyPickedCategory({ key: 'cat_017_001', name: '水果', level1: '生鲜' });

      const st = p.get('status');
      if (st === 'off' || st === 'sold') {
        document.getElementById('onSw').dataset.on = '0';
        selectChip('gStatus', st === 'sold' ? 'draft' : 'off');
      }
    }

    try {
      var picked = JSON.parse(sessionStorage.getItem('pickedCategory') || 'null');
      if (picked && picked.name) applyPickedCategory(picked);
    } catch (e) {}
    syncCatPickHref();
  })();
</script>
</body>
</html>
