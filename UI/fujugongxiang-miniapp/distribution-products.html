weight:800}.sold{font-size:10px;color:#aaa;margin-top:4px}.bottom{height:52px;border-top:1px solid #eee;display:flex;align-items:center;justify-content:space-around;color:#777;font-size:11px}.bottom a{color:inherit;text-decoration:none}.bottom .on{color:#ef4d3a}</style></head><body><div class="app"><header class="head"><div class="top"><a class="back" href="home.html">‹</a><div class="search">⌕&nbsp; 搜索分销商品<button>搜索</button></div></div></header><div class="title">一级分销商品</div><div class="sub">共 200 个商品 · 按佣金优先排序</div><div class="tabs"><button class="on">全部商品</button><button>高佣金</button><button>销量优先</button><button>新品</button></div><main class="scroll"><div class="grid" id="grid"></div></main><nav class="bottom"><a class="on" href="home.html">首页</a><a href="distribution.html">分销中心</a><a href="orders.html">订单</a><a href="profile.html">我的</a></nav></div><script>const items=[['UGG【明星同款】冬季新款女士双面简袜','¥788.00','¥94.56','354'],['Teenie Weenie 小熊POLO连衣裙女藏青色','¥399.00','¥47.88','284'],['Teenie Weenie 小熊针织衫女','¥349.00','¥41.88','409'],['UGG【明星同款】冬季新款女鞋','¥599.00','¥71.88','318'],['四川特产红心猕猴桃','¥39.90','¥6.00','1268'],['金堂脐橙 10斤装','¥29.90','¥4.50','3150']];document.getElementById('grid').innerHTML=items.map(function(x,i){return '<a class="card" href="product-detail.html"><div class="pic"><span>🛍️</span><b class="corner">'+(i%2?'热卖':'年货节')+'</b></div><div class="body"><div class="name">'+x[0]+'</div><span class="commission">一级分销佣金 '+x[2]+'</span><div class="price">'+x[1]+'</div><div class="sold">已售'+x[3]+'件</div></div></a>'}).join('');</script></body></html>
